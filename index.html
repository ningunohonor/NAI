                        <div class="font-bold text-emerald-400 uppercase tracking-wider flex items-center justify-between">

                        <div id="hw-details" class="text-slate-400 leading-snug">

                            <optgroup id="opt-group-local" label="🖥️ En tu Computadora (Sin Login - Solo PC potente)">

                                <option value="local-medium">⚙️ Local Medio — SmolLM2 360M</option>
                            </optgroup>
                            <optgroup label="☁️ Nube Gemini (Requiere Iniciar Sesión)">
                                <option value="cloud-auto">✨ Auto Nube — Gemini 3.0 (3.5 común / 3.6 código)</option>
                                <option value="google/gemini-3.5-flash">💬 Gemini 3.5 Flash (Respuestas comunes)</option>
                                <option value="google/gemini-3.6-flash">💻 Gemini 3.6 Flash (Código y programación)</option>
                                <option value="google/gemini-3-flash-preview">🧭 Gemini 3.0 Flash (Directo)</option>
                                <option value="google/gemini-3.8-flash">⚡ Gemini 3.8 Flash (Avanzado rápido)</option>
                            </optgroup>
                            <optgroup label="🚀 Modelos Avanzados en la Nube (Requiere Iniciar Sesión)">
                                <option value="google/gemini-4-hydrogen">🌟 Gemini 4 Hydrogen (Uso diario avanzado)</option>
                                <option value="google/gemini-4-argon">🧬 Gemini 4 Argon (Ingeniería y razonamiento)</option>
                                <option value="google/gemini-4-carbon">💎 Gemini 4 Carbon (Máxima potencia Google)</option>
                                <option value="gpt-6-luna">🤖 GPT-6 Luna (OpenAI)</option>
                                <option value="claude-opus-4-8">🟣 Claude Opus 4.8 (Anthropic)</option>
                            </optgroup>

                <div class="hidden sm:flex items-center space-x-2 text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20 flex-shrink-0">

            <!-- Banner dinámico cuando se requiere iniciar sesión (Celular, PC justa, o PC usando modelo nube) -->

                    <i id="banner-icon" class="fa-solid fa-cloud text-amber-400 text-base mt-0.5"></i>
                    <div id="banner-message">
                        Inicia sesión para ejecutar este modelo en la nube.
                    </div>
                </div>
                <button onclick="handlePuterAuth()" class="px-4 py-1.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs flex-shrink-0 shadow">
                    Iniciar sesión
                </button>
            </div>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 custom-scrollbar"></div>

            <div class="input-wrapper p-4 sm:p-6 glass-panel border-t border-white/5 relative z-20">
                <div class="max-w-4xl mx-auto">
                    <div class="input-box relative flex items-center bg-slate-900 rounded-2xl border border-white/10 shadow-2xl overflow-hidden">
                        <textarea 
                            id="user-input" 
                            rows="1" 
                            placeholder="Escribe tu mensaje..." 
                            onkeydown="handleKeyDown(event)"

                            class="w-full bg-transparent text-slate-100 placeholder-slate-500 rounded-2xl pl-4 pr-14 py-4 text-sm focus:outline-none resize-none max-h-40"
                        ></textarea>
                        <button 
                            id="send-btn"
                            onclick="handleChatSubmit()"
                            class="absolute right-2.5 bottom-2.5 w-10 h-10 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold rounded-xl flex items-center justify-center transition-all shadow-md"
                        >
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Modelos locales SOLO para PC suficientemente potente
        const LOCAL_TIERS = {
            high: {
                id: 'onnx-community/Qwen2.5-0.5B-Instruct',
                label: 'PC Local Potente (Qwen 2.5 0.5B)',
                maxTokens: 320,
                sizeHint: '~380 MB'
            },
            medium: {
                id: 'onnx-community/SmolLM2-360M-Instruct-ONNX',
                label: 'PC Local Media (SmolLM2 360M)',
                maxTokens: 200,
                sizeHint: '~200 MB'
            }
        };

        let conversations = [];
        let activeChatId = null;
        let isProcessing = false;
        let selectedMode = 'cloud-auto';
        let aiWorker = null;

        let deviceProfile = {
            isMobile: false,
            localBlocked: true,
            blockReason: '',
            cores: 2,
            ramGB: null,
            hasWebGPU: false,
            benchMs: 50,
            tier: 'cloud' // 'high' | 'medium' | 'cloud'
        };

        // ============================================================
        // 1. DETECCIÓN DE CELULAR VS COMPUTADORA Y SU POTENCIA
        // ============================================================
        function detectIsMobile() {
            const ua = navigator.userAgent || '';
            const mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
            const iPadOS = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
            const uaDataMobile = navigator.userAgentData?.mobile === true;
            const touchSmall = window.matchMedia('(pointer: coarse)').matches && Math.min(window.screen.width, window.screen.height) <= 900;
            return Boolean(uaDataMobile || mobileUA || iPadOS || touchSmall);
        }

        function runQuickCpuBenchmark() {
            const t0 = performance.now();
            let acc = 0;
            for (let i = 1; i <= 1800000; i++) acc += Math.sqrt(i) * 0.0001;
            if (acc < 0) console.log(acc);
            return Math.round(performance.now() - t0);
        }

        async function inspectDeviceAndHardware() {
            const isMobile = detectIsMobile();
            const cores = navigator.hardwareConcurrency || 2;
            const ramGB = typeof navigator.deviceMemory === 'number' ? navigator.deviceMemory : null;

            let hasWebGPU = false;
            if (!isMobile && 'gpu' in navigator) {
                try {
                    const adapter = await navigator.gpu.requestAdapter();
                    hasWebGPU = Boolean(adapter);
                } catch (_) {}
            }

            const benchMs = isMobile ? 999 : runQuickCpuBenchmark();

            let localBlocked = false;
            let blockReason = '';
            let tier = 'cloud';

            if (isMobile) {
                localBlocked = true;
                blockReason = 'mobile';
            } else {
                // Criterio estricto: si la PC es demasiado justa, NO ejecutar adentro
                const lowRam = ramGB !== null && ramGB < 4;
                const weakCpu = cores <= 2 || benchMs >= 75;
                const borderlineNoGpu = !hasWebGPU && (cores < 4 || (ramGB !== null && ramGB <= 4 && benchMs >= 50));

                if (lowRam || weakCpu || borderlineNoGpu) {
                    localBlocked = true;
                    blockReason = 'weak_pc';
                } else if (
                    (hasWebGPU && (ramGB === null || ramGB >= 4) && cores >= 4) ||
                    (cores >= 8 && (ramGB === null || ramGB >= 8) && benchMs < 40)
                ) {
                    tier = 'high';
                } else {
                    tier = 'medium';
                }
            }

            deviceProfile = { isMobile, localBlocked, blockReason, cores, ramGB, hasWebGPU, benchMs, tier };
        }

        function applyDevicePolicyToUI() {
            const tag = document.getElementById('device-tag');
            const hwIcon = document.getElementById('hw-icon');
            const hwDetails = document.getElementById('hw-details');
            const selector = document.getElementById('model-selector');

            const ramText = deviceProfile.ramGB ? `${deviceProfile.ramGB} GB` : 'No expuesta';
            const gpuText = deviceProfile.hasWebGPU ? 'WebGPU' : 'CPU';

            // Habilitar o bloquear opciones locales según corresponda
            Array.from(selector.options).forEach(opt => {
                if (opt.value.startsWith('local-')) {
                    opt.disabled = deviceProfile.localBlocked;
                    const cleanText = opt.text.replace(' (Bloqueado en este equipo)', '');
                    opt.text = deviceProfile.localBlocked ? cleanText + ' (Bloqueado en este equipo)' : cleanText;
                }
            });

            if (deviceProfile.isMobile) {
                tag.innerText = 'Celular · Solo Nube';
                hwIcon.className = 'fa-solid fa-mobile-screen-button text-amber-400';
                hwDetails.innerHTML = `
                    <div><strong>Equipo:</strong> Celular / Móvil</div>
                    <div><strong>Ejecución local:</strong> Desactivada</div>
                    <div class="text-amber-400 font-semibold mt-1">Usa la nube con inicio de sesión</div>
                `;
                selectedMode = 'cloud-auto';
                selector.value = 'cloud-auto';
                setStatus('Celular · Requiere Login');
            } else if (deviceProfile.localBlocked) {
                tag.innerText = 'PC Justa · Modo Nube';
                hwIcon.className = 'fa-solid fa-laptop text-amber-400';
                hwDetails.innerHTML = `
                    <div><strong>CPU:</strong> ${deviceProfile.cores} hilos (${deviceProfile.benchMs} ms)</div>
                    <div><strong>RAM:</strong> ${ramText} · <strong>Motor:</strong> ${gpuText}</div>
                    <div class="text-amber-400 font-semibold mt-1">Equipo justo: IA local bloqueada para no trabar tu PC. Se usa la nube.</div>
                `;
                selectedMode = 'cloud-auto';
                selector.value = 'cloud-auto';
                setStatus('PC Justa · Modo Nube');
            } else {
                const tierLabel = deviceProfile.tier === 'high' ? 'Alta (Qwen 2.5 0.5B)' : 'Media (SmolLM2 360M)';
                tag.innerText = 'PC Lista · Local o Nube';
                hwIcon.className = 'fa-solid fa-desktop text-emerald-400';
                hwDetails.innerHTML = `
                    <div><strong>CPU:</strong> ${deviceProfile.cores} hilos (${deviceProfile.benchMs} ms)</div>
