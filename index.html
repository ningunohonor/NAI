<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAI v9</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.puter.com/v2/" async></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config={darkMode:'class'};</script>
<style>
.light body{background:#f8fafc!important;color:#0f172a!important}
.light main{background:#f1f5f9!important}
.light aside,.light header,.light .iw,.light .mb{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}
.light .ib,.light #mbtn,.light .mc{background:#e2e8f0!important;color:#0f172a!important;border-color:#cbd5e1!important}
.light .ba{background:#fff!important;color:#0f172a!important;border:1px solid #cbd5e1!important}
.pc pre{background:#020617;color:#e2e8f0;padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0;font-size:12px}
.pc code{background:rgba(16,185,129,.15);color:#34d399;padding:2px 5px;border-radius:4px;font-size:.85em}
.pc pre code{background:transparent;color:inherit;padding:0}
</style>
</head>
<!-- FIN 1 -->
<body class="bg-slate-950 text-slate-100 h-[100dvh] w-full overflow-hidden flex antialiased">
<aside id="sb-m" class="fixed md:relative inset-y-0 left-0 z-40 w-64 bg-slate-900 border-r border-white/10 flex flex-col justify-between -translate-x-full md:translate-x-0 transition-transform">
<div class="p-3 space-y-2.5 overflow-y-auto flex-1">
<div class="flex items-center justify-between pb-2 border-b border-white/10">
<div><b class="text-emerald-400">NAI v9</b><div id="dtag" class="text-[10px] text-slate-400">...</div></div>
<button onclick="togSb(0)" class="md:hidden p-2 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
</div>
<button onclick="newChat()" class="w-full py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs">+ Nueva</button>
<button onclick="authBtn()" class="w-full py-2 px-3 rounded-xl bg-white/5 border border-white/10 text-xs flex justify-between items-center"><span id="albl">Iniciar sesión</span><i id="adot" class="fa-solid fa-circle text-[8px] text-amber-400"></i></button>
<div id="hwbox" class="p-2 rounded-xl bg-slate-950/60 border border-white/10 text-[11px] text-slate-400"></div>
<div id="hlist" class="space-y-1"></div>
</div>
<div class="p-3 border-t border-white/10"><button onclick="togTh()" class="w-full py-2 px-3 rounded-xl bg-white/5 text-xs flex justify-between"><span id="tlbl">Oscuro</span><i class="fa-solid fa-circle-half-stroke text-emerald-400"></i></button></div>
</aside>
<!-- FIN 2 -->
<main class="flex-1 flex flex-col h-full min-w-0 bg-slate-950">
<header class="h-14 border-b border-white/10 bg-slate-900/90 flex items-center justify-between px-3 gap-2 flex-shrink-0">
<div class="flex items-center space-x-2 min-w-0 flex-1">
<button onclick="togSb(1)" class="md:hidden p-2 text-slate-300"><i class="fa-solid fa-bars"></i></button>
<button id="mbtn" onclick="openMod()" class="flex items-center space-x-1.5 bg-slate-800 border border-white/10 rounded-xl px-3 py-1.5 text-xs font-semibold min-w-0 truncate"><span id="mico">✨</span><span id="mnam" class="truncate">Auto</span><i class="fa-solid fa-chevron-down text-[10px]"></i></button>
</div>
<span id="st" class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full">...</span>
</header>
<div id="lban" class="hidden bg-amber-500/15 border-b border-amber-500/30 px-3 py-2 flex items-center justify-between gap-2 text-xs">
<span>Inicia sesión gratis para usar Gemini.</span>
<button onclick="loginDir()" class="px-3 py-1 rounded-lg bg-amber-400 text-slate-950 font-bold">🔑 Login</button>
</div>
<div id="cbox" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
<!-- FIN 3 -->
<div class="iw p-2.5 bg-slate-900/90 border-t border-white/10">
<div class="ib max-w-3xl mx-auto flex items-end bg-slate-800 rounded-2xl border border-white/10 p-1.5">
<textarea id="uin" rows="1" placeholder="Escribe..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" class="w-full bg-transparent px-3 py-2 text-sm focus:outline-none resize-none max-h-32"></textarea>
<button onclick="send()" class="w-10 h-10 bg-emerald-500 text-slate-950 rounded-xl font-bold flex-shrink-0"><i class="fa-solid fa-arrow-up"></i></button>
</div></div></main>
<div id="mmod" onclick="if(event.target===this)closeMod()" class="hidden fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center sm:p-4">
<div class="mb w-full sm:max-w-md bg-slate-900 border border-white/10 rounded-t-3xl sm:rounded-2xl max-h-[80dvh] flex flex-col overflow-hidden">
<div class="p-3 border-b border-white/10 flex justify-between items-center"><div><b class="text-sm">Elegir Modelo</b><div id="msub" class="text-[11px] text-slate-400"></div></div><button onclick="closeMod()" class="p-2"><i class="fa-solid fa-xmark"></i></button></div>
<div id="mlist" class="p-3 space-y-3 overflow-y-auto"></div>
</div></div>
<!-- FIN 4 -->
<script>
var BT3=String.fromCharCode(96,96,96),BT1=String.fromCharCode(96),wk=null,chats=[],aid=null,busy=0,mode='cloud-auto';
var hw={mob:1,blk:1,cor:2,ram:null,gpu:0,tier:'cloud'};
var LM=[{id:'local-auto',i:'⚡',n:'Auto PC',d:'Ajustado a tu PC'},{id:'local-high',i:'🧠',n:'Qwen 2.5 0.5B',d:'PC Potente'},{id:'local-medium',i:'⚙️',n:'SmolLM2 360M',d:'PC Media'}];
var CM=[{id:'cloud-auto',i:'✨',n:'Auto (Gemini 3.0)',d:'3.5 común / 3.6 código'},{id:'google/gemini-3.5-flash',i:'💬',n:'Gemini 3.5 Flash',d:'Respuestas comunes'},{id:'google/gemini-3.6-flash',i:'💻',n:'Gemini 3.6 Flash',d:'Código'},{id:'google/gemini-3-flash-preview',i:'🧭',n:'Gemini 3.0 Flash',d:'Directo'},{id:'google/gemini-3.8-flash',i:'⚡',n:'Gemini 3.8 Flash',d:'Rápido avanzado'},{id:'google/gemini-4-hydrogen',i:'🌟',n:'Gemini 4 Hydrogen',d:'Diario avanzado'},{id:'google/gemini-4-argon',i:'🧬',n:'Gemini 4 Argon',d:'Ingeniería'},{id:'google/gemini-4-carbon',i:'💎',n:'Gemini 4 Carbon',d:'Top Google'},{id:'gpt-6-luna',i:'🤖',n:'GPT-6 Luna',d:'OpenAI'},{id:'claude-opus-4-8',i:'🟣',n:'Claude Opus 4.8',d:'Anthropic'}];
function isIn(){try{return typeof puter!=='undefined'&&puter.auth&&puter.auth.isSignedIn();}catch(e){return 0;}}
/* FIN 5 */
function detectHW(){
  var ua=navigator.userAgent||'';
  var mob=/Android|webOS|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua)||(navigator.maxTouchPoints>0&&innerWidth<=1024);
  var cor=navigator.hardwareConcurrency||2,ram=typeof navigator.deviceMemory==='number'?navigator.deviceMemory:null,b=999;
  if(!mob){var t0=performance.now(),a=0;for(var i=1;i<=1200000;i++)a+=Math.sqrt(i);if(a<0)console.log(a);b=Math.round(performance.now()-t0);}
  var blk=mob||(ram!==null&&ram<4)||cor<=2||b>=75;
  var tier=blk?'cloud':(cor>=8&&(ram===null||ram>=8)&&b<40?'high':'medium');
  hw={mob:mob,blk:blk,cor:cor,ram:ram,gpu:0,tier:tier};
}
function upd(){
  if(hw.blk&&mode.indexOf('local-')===0)mode='cloud-auto';
  var all=hw.blk?CM:LM.concat(CM),info=all.find(function(x){return x.id===mode;})||CM[0];mode=info.id;
  document.getElementById('mico').innerText=info.i;document.getElementById('mnam').innerText=info.n;
  document.getElementById('dtag').innerText=hw.mob?'Celular · Nube':(hw.blk?'PC Justa · Nube':'PC · Local/Nube');
  document.getElementById('hwbox').innerHTML=hw.mob?'📱 Celular: solo Nube.':(hw.blk?'💻 PC Justa: solo Nube.':'🖥️ PC ('+hw.cor+' hilos): Local o Nube.');
  var s=isIn();
  document.getElementById('adot').className='fa-solid fa-circle text-[8px] '+(s?'text-emerald-400':'text-amber-400');
  document.getElementById('albl').innerText=s?'Sesión activa':'Iniciar sesión';
  document.getElementById('lban').classList.toggle('hidden',s||mode.indexOf('local-')===0);
  document.getElementById('st').innerText=mode.indexOf('local-')===0?'Local':(s?'Nube':'Login');
}
/* FIN 6 */function togSb(o){document.getElementById('sb-m').classList.toggle('-translate-x-full',!o);}
function togTh(){var d=!document.documentElement.classList.contains('dark');document.documentElement.classList.toggle('dark',d);document.documentElement.classList.toggle('light',!d);document.getElementById('tlbl').innerText=d?'Oscuro':'Claro';setLS('nai9t',d?'dark':'light');}
function openMod(){
  document.getElementById('msub').innerText=hw.blk?'Solo modelos en la nube.':'Local (sin login) o Nube (con login).';
  function card(m){return '<button onclick="pick(\''+m.id+'\')" class="mc w-full text-left p-2.5 rounded-xl border flex items-center gap-2.5 '+(m.id===mode?'bg-emerald-500/15 border-emerald-500':'bg-slate-800 border-white/10')+'"><span class="text-lg">'+m.i+'</span><div><div class="text-xs font-bold">'+esc(m.n)+'</div><div class="text-[11px] text-slate-400">'+esc(m.d)+'</div></div></button>';}
  var h=hw.blk?'':'<div class="text-[10px] font-bold uppercase text-slate-400">🖥️ En tu PC</div>'+LM.map(card).join('');
  h+='<div class="text-[10px] font-bold uppercase text-slate-400 mt-2">☁️ En la Nube</div>'+CM.map(card).join('');
  document.getElementById('mlist').innerHTML=h;document.getElementById('mmod').classList.remove('hidden');
}
function closeMod(){document.getElementById('mmod').classList.add('hidden');}
function pick(id){mode=id;setLS('nai9m',mode);upd();closeMod();}
function loginDir(cb){
  if(typeof puter==='undefined'||!puter.auth){addM('assistant','⚠️ Puter.js aún cargando o bloqueado.','Aviso');return;}
  document.getElementById('st').innerText='Login...';
  puter.auth.signIn({attempt_temp_user_creation:true}).then(function(){upd();if(cb)cb();}).catch(function(e){upd();var m=(e&&(e.message||e.error))||JSON.stringify(e);if(String(m).indexOf('closed')===-1)addM('assistant','⚠️ '+m,'Aviso');});
}
function authBtn(){if(isIn()){if(confirm('¿Cerrar sesión?')){puter.auth.signOut();upd();}}else loginDir();}
/* FIN 7 */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){var b=[],rB=new RegExp(BT3+'[\\w-]*\\n?([\\s\\S]*?)'+BT3,'g'),rI=new RegExp(BT1+'([^'+BT1+'\\n]+)'+BT1,'g'),x=String(t).replace(rB,function(_,c){b.push('<pre><code>'+esc(c.replace(/\s+$/,''))+'</code></pre>');return'@@'+((b.length)-1)+'@@';});x=esc(x).replace(rI,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');for(var i=0;i<b.length;i++)x=x.replace('@@'+i+'@@',b[i]);return x;}
function getLS(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function setLS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function newChat(){if(busy)return;var id='c'+Date.now(),t=hw.blk?'👋 Toca **🔑 Login** arriba para activar Gemini 3.0 / 3.5 / 3.6.':'🖥️ PC lista para IA local sin login o Nube.';chats.unshift({id:id,t:'Nueva',m:[{r:'assistant',s:1,l:'NAI v9',t:t}]});aid=id;saveC();renH();renM();togSb(0);}
function selC(id){aid=id;renH();renM();togSb(0);}
function getC(){return chats.find(function(c){return c.id===aid;})||chats[0];}
function saveC(){setLS('nai9c',JSON.stringify(chats));}
function addM(r,t,l){getC().m.push({r:r,t:t,l:l,s:r==='assistant'&&l==='Aviso'});saveC();renM();}
function renH(){document.getElementById('hlist').innerHTML=chats.map(function(c){return '<div onclick="selC(\''+c.id+'\')" class="p-2 rounded-lg text-xs truncate cursor-pointer '+(c.id===aid?'bg-emerald-500/20 text-emerald-400':'text-slate-400')+'">'+esc(c.t)+'</div>';}).join('');}
function renM(){var b=document.getElementById('cbox');b.innerHTML=getC().m.map(function(x){return x.r==='user'?'<div class="flex justify-end"><div class="max-w-[85%] bg-emerald-500 text-slate-950 font-medium px-3 py-2 rounded-2xl text-sm">'+fmt(x.t)+'</div></div>':'<div class="flex justify-start"><div class="ba pc max-w-[90%] bg-slate-900 border border-white/10 px-3 py-2.5 rounded-2xl text-sm">'+(x.l?'<div class="text-[10px] font-bold text-emerald-400 uppercase mb-1">'+esc(x.l)+'</div>':'')+'<div '+(x.st?'id="sb"':'')+'>'+(x.t?fmt(x.t):'Pensando...')+'</div></div></div>';}).join('');b.scrollTop=b.scrollHeight;}
/* FIN 8 */
function runLocal(hist,mo){
  return new Promise(function(res,rej){
    if(!wk){
      var c="import {pipeline,TextStreamer,env} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers';const c=new Map();self.onmessage=async e=>{const{id,m,d,msgs,max}=e.data;try{if(env?.backends?.onnx?.wasm)env.backends.onnx.wasm.numThreads=1;let g=c.get(m);if(!g){g=await pipeline('text-generation',m,{device:d,dtype:'q4',progress_callback:p=>{if(p.status==='progress')self.postMessage({id,ev:'p',p:Math.round(p.progress)})}});c.set(m,g);}let o='';const s=new TextStreamer(g.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>{o+=t;self.postMessage({id,ev:'t',t:o})}});await g(msgs,{max_new_tokens:max,do_sample:true,temperature:0.65,streamer:s});self.postMessage({id,ev:'d',t:o.trim()})}catch(err){self.postMessage({id,ev:'e',e:err.message||String(err)})}};";
      wk=new Worker(URL.createObjectURL(new Blob([c],{type:'application/javascript'})),{type:'module'});
    }
    var hi=mode==='local-high'||(mode==='local-auto'&&hw.tier==='high'),m=hi?'onnx-community/Qwen2.5-0.5B-Instruct':'onnx-community/SmolLM2-360M-Instruct-ONNX',id='r'+Date.now();
    var fn=function(e){var d=e.data;if(!d||d.id!==id)return;if(d.ev==='p'){mo.t='Descargando: '+d.p+'%';renM();}else if(d.ev==='t'){mo.t=d.t;var s=document.getElementById('sb');if(s){s.innerHTML=fmt(d.t);document.getElementById('cbox').scrollTop=999999;}}else if(d.ev==='d'){wk.removeEventListener('message',fn);res(d.t||'Sin respuesta.');}else if(d.ev==='e'){wk.removeEventListener('message',fn);rej(new Error(d.e));}};
    wk.addEventListener('message',fn);
    wk.postMessage({id:id,m:m,d:hw.gpu?'webgpu':'wasm',max:hi?300:180,msgs:[{role:'system',content:'You are NAI. Answer in user language.'}].concat(hist.slice(-4).map(function(x){return{role:x.r,content:x.t};}))});
  });
}
/* FIN 9 */
async function runCloud(hist,mo,p){
  var tg=mode;
  if(mode==='cloud-auto'){
    document.getElementById('st').innerText='Gemini 3.0...';
    try{var r=await puter.ai.chat([{role:'system',content:'Responde SOLO: CODE si es código, o CHAT para todo lo demás.'},{role:'user',content:p}],false,{model:'google/gemini-3-flash-preview',stream:false,normalize:true});var tx=typeof r==='string'?r:((r&&r.text)||(r&&r.message&&r.message.content)||'');tg=String(tx).toUpperCase().indexOf('CODE')!==-1?'google/gemini-3.6-flash':'google/gemini-3.5-flash';}catch(e){tg=/(html|css|js|python|sql|código|codigo|programar|error)/i.test(p)?'google/gemini-3.6-flash':'google/gemini-3.5-flash';}
    mo.l=tg.indexOf('3.6')!==-1?'Gemini 3.0 → 3.6 (Código)':'Gemini 3.0 → 3.5 (Común)';
  }else{mo.l=(CM.find(function(x){return x.id===tg;})||{}).n||tg;}
  renM();document.getElementById('st').innerText='Escribiendo...';
  var msgs=[{role:'system',content:'Eres NAI, asistente claro y útil. Responde en el idioma del usuario.'}].concat(hist.slice(-12).map(function(x){return{role:x.r,content:x.t};}));
  var resp=await puter.ai.chat(msgs,false,{model:tg,stream:true,normalize:true}),out='';
  if(resp&&typeof resp[Symbol.asyncIterator]==='function'){for await(var pt of resp){var ch=(pt&&pt.text)||(pt&&pt.choices&&pt.choices[0]&&pt.choices[0].delta&&pt.choices[0].delta.content)||'';if(ch){out+=ch;mo.t=out;var s=document.getElementById('sb');if(s){s.innerHTML=fmt(out);document.getElementById('cbox').scrollTop=999999;}}}}else{out=typeof resp==='string'?resp:((resp&&resp.text)||(resp&&resp.message&&resp.message.content)||String(resp));}
  return out.trim()||'Sin respuesta.';
}
function send(){
  if(busy)return;var u=document.getElementById('uin'),p=u.value.trim();if(!p)return;
  var uc=hw.blk||mode.indexOf('local-')!==0;if(uc&&!isIn()){loginDir(function(){send();});return;}
  u.value='';u.style.height='auto';var c=getC();if(c.t==='Nueva'){c.t=p.slice(0,25);renH();}
  c.m.push({r:'user',t:p});var hist=c.m.filter(function(x){return!x.s;}),mo={r:'assistant',st:1,l:'...',t:''};c.m.push(mo);renM();busy=1;
  (async function(){try{mo.t=uc?await runCloud(hist,mo,p):await runLocal(hist,mo);}catch(e){mo.s=1;mo.l='Aviso';mo.t='⚠️ '+((e&&(e.message||e.error))||JSON.stringify(e));}finally{delete mo.st;busy=0;upd();saveC();renM();}})();
}
(function(){
  detectHW();try{chats=JSON.parse(getLS('nai9c')||'[]');}catch(e){chats=[];}
  var sm=getLS('nai9m');if(sm)mode=sm;if(getLS('nai9t')==='light')togTh();
  if(!chats.length)newChat();else{aid=chats[0].id;renH();renM();}upd();
  var t=0,iv=setInterval(function(){t++;if(typeof puter!=='undefined'||t>25){clearInterval(iv);upd();}},300);
  if(!hw.mob&&navigator.gpu)navigator.gpu.requestAdapter().then(function(a){hw.gpu=Boolean(a);if(hw.gpu&&!hw.blk)hw.tier='high';upd();}).catch(function(){});
})();
</script>
</body>
</html>
