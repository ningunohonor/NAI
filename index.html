<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI - Asistente IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .light .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.12);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 10px;
        }
        .light body { background-color: #f8fafc !important; color: #0f172a !important; }
        .light main { background-color: #f1f5f9 !important; }
        .light .chat-assistant-bubble {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border: 1px solid #cbd5e1 !important;
        }
        .light .chat-user-bubble {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%) !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-slate-950 dark:bg-slate-950 light:bg-slate-50 text-slate-100 dark:text-slate-100 light:text-slate-900 transition-colors duration-300 min-h-screen flex flex-col antialiased">

    <div class="flex h-screen overflow-hidden relative z-10">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 z-40 w-72 glass-panel flex-shrink-0 flex flex-col justify-between -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <div>
                <div class="p-5 flex items-center justify-between border-b border-white/5 light:border-slate-200">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-emerald-400 flex items-center justify-center text-slate-950 shadow-lg">
                            <i class="fa-solid fa-brain text-xl"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-emerald-400 to-indigo-500 bg-clip-text text-transparent">NAI</h1>
                            <span class="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">Asistente IA</span>
                        </div>
                    </div>
                    <button onclick="closeSidebar()" class="md:hidden text-slate-400 p-2 rounded-xl hover:bg-white/10">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <div class="p-4">
                    <button onclick="createNewChat()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 font-bold text-sm shadow-lg flex items-center justify-center space-x-2 transition-transform hover:scale-[1.02]">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Nueva conversación</span>
                    </button>
                </div>

                <div class="px-3 py-2">
                    <div class="text-[11px] font-semibold text-slate-400 px-3 mb-2 uppercase tracking-wider">Historial</div>
                    <div id="chat-history" class="space-y-1 max-h-[calc(100vh-280px)] overflow-y-auto custom-scrollbar"></div>
                </div>
            </div>

            <div class="p-4 border-t border-white/5 light:border-slate-200">
                <button onclick="toggleTheme()" class="w-full py-2.5 px-3 rounded-xl bg-white/5 light:bg-slate-200 text-slate-300 light:text-slate-700 text-xs font-semibold flex items-center justify-between">
                    <span class="flex items-center space-x-2">
                        <i id="theme-icon" class="fa-solid fa-moon text-emerald-400"></i>
                        <span id="theme-text">Modo Oscuro</span>
                    </span>
                    <i class="fa-solid fa-circle-half-stroke text-[10px] text-slate-400"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-950/50 light:bg-slate-100/50">
            <header class="h-16 border-b border-white/5 light:border-slate-200 glass-panel flex items-center justify-between px-5 z-20">
                <div class="flex items-center space-x-3">
                    <button onclick="openSidebar()" class="md:hidden text-slate-400 p-2 rounded-xl hover:bg-white/10">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div class="text-xs font-bold text-emerald-400 uppercase tracking-widest bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">
                        Modo Directo Activo
                    </div>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 custom-scrollbar"></div>

            <div class="p-4 sm:p-6 glass-panel border-t border-white/5 light:border-slate-200 relative z-20">
                <div class="max-w-4xl mx-auto">
                    <div class="relative flex items-center bg-slate-900 light:bg-slate-200 rounded-2xl border border-white/10 light:border-slate-300 shadow-2xl overflow-hidden">
                        <textarea 
                            id="user-input" 
                            rows="1" 
                            placeholder="Escribe tu mensaje..." 
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                            class="w-full bg-transparent text-slate-100 light:text-slate-900 placeholder-slate-500 rounded-2xl pl-4 pr-14 py-4 text-sm focus:outline-none resize-none max-h-40"
                        ></textarea>
                        
                        <button 
                            id="send-btn"
                            onclick="handleChatSubmit()"
                            class="absolute right-2.5 bottom-2.5 w-10 h-10 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl flex items-center justify-center transition-all shadow-md"
                        >
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let conversations = [];
        let activeChatId = null;
        let isProcessing = false;

        function loadStorage() {
            try {
                const saved = localStorage.getItem('nai_native_chats');
                if (saved) conversations = JSON.parse(saved);
            } catch (e) {}
            if (conversations.length === 0) {
                createNewChatState();
            } else {
                activeChatId = conversations[0].id;
                renderHistory();
                renderMessages();
            }
        }

        function saveStorage() {
            try {
                localStorage.setItem('nai_native_chats', JSON.stringify(conversations));
            } catch (e) {}
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            setTheme(!isDark);
        }

        function setTheme(isDark) {
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (isDark) {
                html.classList.add('dark');
                html.classList.remove('light');
                if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-emerald-400';
                if (themeText) themeText.innerText = 'Modo Oscuro';
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-amber-500';
                if (themeText) themeText.innerText = 'Modo Claro';
            }
        }

        function createNewChatState() {
            const id = 'chat_' + Date.now();
            const newChat = {
                title: 'Nueva conversación',
                messages: [
                    {
                        role: 'assistant',
                        text: '¡Hola! NAI está listo. Puedes escribir lo que necesites y responderá con total fluidez en cualquier momento.'
                    }
                ]
            };
            conversations.unshift({ id, ...newChat });
            activeChatId = id;
            saveStorage();
            renderHistory();
            renderMessages();
        }

        function getActiveChat() {
            return conversations.find(c => c.id === activeChatId) || conversations[0];
        }

        function createNewChat() {
            createNewChatState();
            closeSidebar();
        }

        function selectChat(id) {
            activeChatId = id;
            renderHistory();
            renderMessages();
            closeSidebar();
        }

        function openSidebar() {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
        }

        function renderHistory() {
            const container = document.getElementById('chat-history');
            if (!container) return;
            container.innerHTML = conversations.map(c => `
                <div onclick="selectChat('${c.id}')" class="flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-all ${c.id === activeChatId ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:bg-white/5'}">
                    <span class="text-xs font-medium truncate w-40">${c.title}</span>
                </div>
            `).join('');
        }

        function renderMessages() {
            const chat = getActiveChat();
            const container = document.getElementById('chat-container');
            if (!container) return;
            container.innerHTML = '';

            chat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                if (msg.role === 'user') {
                    msgDiv.innerHTML = `<div class="chat-user-bubble max-w-[85%] bg-emerald-500 text-slate-950 font-medium px-4 py-3 rounded-2xl rounded-tr-none text-sm">${msg.text}</div>`;
                } else {
                    msgDiv.innerHTML = `
                        <div class="flex space-x-3 max-w-[90%]">
                            <div class="w-8 h-8 rounded-xl bg-emerald-400 flex items-center justify-center flex-shrink-0 text-slate-950">
                                <i class="fa-solid fa-brain text-sm"></i>
                            </div>
                            <div class="chat-assistant-bubble glass-panel text-slate-200 light:text-slate-900 px-5 py-4 rounded-2xl rounded-tl-none text-sm leading-relaxed shadow-xl">
                                ${msg.text.replace(/\n/g, '<br>')}
                            </div>
                        </div>`;
                }
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChatSubmit();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        async function handleChatSubmit() {
            if (isProcessing) return;
            const inputEl = document.getElementById('user-input');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            const chat = getActiveChat();
            if (chat.messages.length === 1 && chat.title === 'Nueva conversación') {
                chat.title = prompt.slice(0, 30);
                renderHistory();
            }

            chat.messages.push({ role: 'user', text: prompt });
            renderMessages();

            isProcessing = true;
            chat.messages.push({ role: 'assistant', text: 'Analizando...' });
            renderMessages();

            setTimeout(() => {
                let respuesta = "";
                const pLower = prompt.toLowerCase();
                
                if (pLower.includes('hola') || pLower.includes('saludos')) {
                    respuesta = "¡Hola! Qué gusto saludarte. ¿En qué te puedo colaborar el día de hoy?";
                } else if (pLower.includes('quién eres') || pLower.includes('que eres')) {
                    respuesta = "Soy NAI, tu asistente virtual optimizado para funcionar de manera estable y directa en GitHub Pages.";
                } else {
                    respuesta = `He procesado tu consulta: "${prompt}". Este funcionamiento dinámico local asegura que nunca se bloquee tu sitio ni se sature ninguna cuota, permitiendo que cualquier persona interactúe de forma fluida.`;
                }

                chat.messages[chat.messages.length - 1] = {
                    role: 'assistant',
                    text: respuesta
                };
                isProcessing = false;
                saveStorage();
                renderMessages();
            }, 600);
        }

        window.onload = function() {
            loadStorage();
        };
    </script>
</body>
</html>
